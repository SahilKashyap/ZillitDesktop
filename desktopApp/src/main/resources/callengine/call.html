<!DOCTYPE html>
<!--
  The media host page for Zillit Desktop calling.

  Loaded into embedded Chromium (KCEF) from a local file, with the Agora Web
  SDK bundled beside it — no CDN, no network beyond Agora's own media edge.

  This page draws its own tile chrome — name, mute badge, speaking ring —
  because a heavyweight browser surface owns every pixel inside its rectangle
  and anything Compose paints on top of it is simply not shown. Kotlin pushes
  identity and shape down through `zillitCall.setStage`; who is speaking and
  who has video the page knows first-hand, a frame earlier than Kotlin could
  tell it.

  Colours arrive through `setTheme`, so the stage is not a foreign slab in the
  middle of the window.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Zillit Call</title>
    <style>
        /* Defaults for a page opened outside the app — the demo harness runs
           in a plain browser, where nothing ever calls setTheme. */
        :root {
            /* The web's Line 3 stage (`lineTwo/ui/styles.css:3-19`, tile #3c4043 at radius 12). */
            --bg: #202124;
            --tile: #3c4043;
            --tile-idle: #2b2d31;
            --border: transparent;
            --text: #e8eaed;
            --muted: #9aa0a6;
            --speaking: #34a853;
            --danger: #ea4335;
            --gap: 8px;
            --radius: 12px;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: var(--text);
        }

        /* Rows of fixed-ratio tiles, centred — the same rule the Compose grid
           follows, so the two renderers cannot disagree about shape. */
        #stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            position: relative;
        }

        /* Two people, or someone presenting: everyone but the big tile floats
           bottom-right, as the web's `.duoSelf` does (`styles.css:449-459`).
           Click one to swap it into the big slot. */
        .strip {
            position: absolute;
            right: 22px;
            bottom: 22px;
            display: flex;
            flex-direction: row;
            gap: var(--gap);
            z-index: 3;
        }

        .tile.mini {
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .55);
        }

        .tile.mini:hover { outline: 2px solid rgba(255, 255, 255, .35); }

        /* Reactions live here rather than on the Compose side: this page is a
           heavyweight native surface, and anything the app draws over it is
           simply not painted. Above the tiles, and click-through, so an emoji
           can never eat a press meant for the video. */
        #reactions {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 5;
        }

        .reaction {
            position: absolute;
            bottom: 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            animation: rise 3.2s linear forwards;
        }

        .reaction .face { font-size: 34px; line-height: 1; }

        .reaction .who {
            font-size: 11px;
            font-weight: 500;
            color: var(--text);
            background: rgba(0, 0, 0, .45);
            padding: 2px 6px;
            border-radius: 999px;
            white-space: nowrap;
        }

        @keyframes rise {
            0%   { transform: translateY(0);      opacity: 1; }
            35%  { opacity: 1; }
            100% { transform: translateY(-230px); opacity: 0; }
        }

        .row {
            display: flex;
            flex-direction: row;
            gap: var(--gap);
            justify-content: center;
        }

        .tile {
            position: relative;
            background: var(--tile);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .tile.idle { background: var(--tile-idle); opacity: .55; }

        .tile video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* The initials disc, shown until a video track arrives. */
        .face {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .disc {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            font-weight: 600;
            overflow: hidden;
        }

        /* A real face fills the disc it replaces, cropped square like the
           avatars the rest of the app draws. */
        .disc img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Two rings: a solid one meaning "talking", and a slow halo that makes
           it read as live rather than as a static outline. */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2.5px solid var(--speaking);
            opacity: 0;
            transition: opacity .48s ease-out;
            pointer-events: none;
        }

        /* Fast in, slow out: speech has gaps between words, and a symmetric
           fade turns an ordinary sentence into a strobing halo. */
        .tile.speaking .ring {
            opacity: 1;
            transition: opacity .09s ease-in;
        }

        .tile.speaking .halo { animation: halo 1.4s linear infinite; }

        @keyframes halo {
            from { transform: scale(1); opacity: .32; }
            to   { transform: scale(1.12); opacity: 0; }
        }

        .chip {
            position: absolute;
            left: 8px;
            bottom: 8px;
            max-width: calc(100% - 16px);
            padding: 2px 8px;
            border-radius: 8px;
            background: rgba(0, 0, 0, .55);
            font-size: 11px;
            line-height: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mute {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--danger);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .tile.muted .mute { display: flex; }
        .mute svg { width: 12px; height: 12px; fill: #fff; }

        /* A raised hand, opposite the mute badge so the two never collide. */
        .hand {
            position: absolute;
            left: 8px;
            top: 8px;
            font-size: 16px;
            line-height: 1;
        }

        /* Minimised: the pill's thumb is 96 px wide, where a name chip is
           unreadable and every tile but the first is invisible anyway. */
        body.compact .chip,
        body.compact .hand,
        body.compact .mute { display: none; }
        body.compact .row:not(:first-child) { display: none; }
        body.compact .tile:not(:first-child) { display: none; }
    </style>
</head>
<body>
<div id="stage"></div>
<div id="reactions"></div>
<script src="agora-rtc-sdk-ng-4.24.2.js"></script>
<script src="call.js"></script>
<!--
  Line 1's media stack. Loaded alongside Agora's rather than instead of it
  because a call's line is not known until it rings, and a page reload mid-ring
  would cost the call. The bundle is 212 KB against the Agora SDK's 1.3 MB.

  Known risk, deliberately accepted for now: the Agora SDK patches
  RTCPeerConnection.prototype globally (it embeds webrtc-adapter), and
  mediasoup-client's Chrome111 handler uses the same prototype. Most of those
  patches are feature-guarded and a current Chromium skips them, but this is
  co-residency rather than isolation. Splitting the two into separate pages is
  the fix if it ever misbehaves.
-->
<script src="mediasoup-client.js"></script>
<script src="mediasoup.js"></script>
<!--
  Line 3's media stack. LiveKit's browser SDK (UMD, global `LivekitClient`)
  beside the other two, for the same reason mediasoup is: a call's line is not
  known until it rings. It shares the page's tile chrome through
  `zillitCall.attachRemote`, so a Line 3 peer looks like any other.
-->
<script src="livekit-client-2.22.2.umd.js"></script>
<script src="livekit.js"></script>
</body>
</html>
