name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows are the primary targets; ubuntu produces the .deb
        # that ChromeOS runs under Crostini (plan §1).
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace
        shell: bash

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
          retention-days: 7

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    # Installers are only built on demand and on main — they are slow, and
    # signing/notarization is not wired up until M12, so these are unsigned.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # jpackage can only build the host OS's format: .dmg on macOS,
      # .msi on Windows, .deb on Linux.
      - name: Package for current OS
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zillit-${{ matrix.os }}
          path: desktopApp/build/compose/binaries/main/**/*
          retention-days: 14
