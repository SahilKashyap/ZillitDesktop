#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Zillit
# Which environment `:desktopApp:run` talks to.
#
# The app itself defaults to PRODUCTION when nothing says otherwise, on purpose:
# a misconfigured install should fail onto the strictest settings rather than
# quietly reach for QA. On a development machine that default inverts, because
# the easiest ways to launch — a bare `./gradlew :desktopApp:run`, or the IDE's
# Run button — set nothing and therefore point at production, announcing it only
# in a startup log line.
#
# This covers every JavaExec launch, the IDE's included (see desktopApp's
# `tasks.withType<JavaExec>` forwarding). It does NOT reach a packaged build, so
# a shipped app still defaults to production as designed. Override per-run with
# `-Pzillit.env=qa` — a command-line property beats this file.
zillit.env=develop

# The desktop app's version — the ONE place it is written.
#
# Read by desktopApp/build.gradle.kts for three things that must agree: the
# `packageVersion` jpackage stamps on the .dmg/.msi/.exe (and into the
# launcher's `jpackage.app-version`), the generated `BuildInfo.VERSION` the
# app shows in Settings and on the sign-in page, and the installed version the
# update check compares against Remote Config's `desktop_latest_version`.
# Bump it here when cutting a release; nowhere else. `-Pzillit.version=1.0.3`
# on the command line overrides it for a one-off build.
zillit.version=1.0.5
